name: Release

# Bei jedem neuen Tag (z. B. v0.7.0) baut GitHub automatisch module.zip und module.json
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: module.json auf diesen Release einstellen
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          REPO="${GITHUB_REPOSITORY}"
          jq --arg v "$VERSION" --arg repo "$REPO" --arg tag "$GITHUB_REF_NAME" '
            .version = $v
            | .url = "https://github.com/\($repo)"
            | .manifest = "https://github.com/\($repo)/releases/latest/download/module.json"
            | .download = "https://github.com/\($repo)/releases/download/\($tag)/module.zip"
          ' module.json > module.release.json
          mv module.release.json module.json
          cat module.json

      - name: module.zip bauen
        run: |
          zip -r module.zip . -x ".git/*" ".github/*" "*.zip"

      - name: Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          files: |
            module.json
            module.zip
          generate_release_notes: true
